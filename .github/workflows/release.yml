name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # cross builds inside a Docker image that ships its own toolchain and
      # a deliberately old glibc, so the binaries run on as many distros as
      # possible. (Native builds on current runners fail: the 2026 stable
      # toolchain itself requires GLIBC_2.39, absent on 22.04 runners.)
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          ASSET="voxtype-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/voxtype" "dist/voxtype"
          tar -czf "dist/${ASSET}.tar.gz" -C dist voxtype
          cd dist
          sha256sum "${ASSET}.tar.gz" >> sha256sums.txt
          rm -f voxtype

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Ship install.sh as a release asset too, so the one-liner
      # https://github.com/atheerium/voxtype/releases/latest/download/install.sh
      # is served by GitHub's fast object CDN instead of the laggy raw CDN.
      - name: Stage installer
        run: cp install.sh artifacts/install.sh

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "voxtype $GITHUB_REF_NAME" \
            --generate-notes
