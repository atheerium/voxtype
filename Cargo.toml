[package]
name = "voxtype"
version = "0.1.1"
edition = "2021"
description = "Free, open-source voice-to-text dictation for Linux. Press Ctrl+Space, speak, and your words are typed into any app. A privacy-friendly, self-hostable alternative to Wispr Flow."
license = "MIT"
repository = "https://github.com/atheerium/voxtype"
homepage = "https://github.com/atheerium/voxtype"
readme = "README.md"
keywords = [
    "voice-to-text",
    "dictation",
    "speech-to-text",
    "whisper",
    "wispr-flow",
    "voice-input",
    "accessibility",
    "wayland",
    "x11",
    "groq",
]
categories = [
    "command-line-utilities",
    "multimedia::audio",
    "accessibility",
]
exclude = [
    ".github",
    "docs",
]

[[bin]]
name = "voxtype"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
