<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="voxtype — free, open-source voice-to-text dictation for Linux. Press Ctrl+Space, speak, done.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- waveform bars -->
  <g fill="url(#wave)" opacity="0.9">
    <rect x="60" y="250" width="14" height="30" rx="4"/>
    <rect x="84" y="230" width="14" height="70" rx="4"/>
    <rect x="108" y="210" width="14" height="110" rx="4"/>
    <rect x="132" y="180" width="14" height="160" rx="4"/>
    <rect x="156" y="200" width="14" height="120" rx="4"/>
    <rect x="180" y="240" width="14" height="50" rx="4"/>
    <rect x="204" y="220" width="14" height="90" rx="4"/>
    <rect x="228" y="190" width="14" height="140" rx="4"/>
    <rect x="252" y="170" width="14" height="180" rx="4"/>
    <rect x="276" y="200" width="14" height="120" rx="4"/>
    <rect x="300" y="230" width="14" height="70" rx="4"/>
    <rect x="324" y="250" width="14" height="30" rx="4"/>
  </g>

  <!-- floating key hint -->
  <g>
    <rect x="62" y="96" width="256" height="52" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)"/>
    <text x="190" y="129" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#f8fafc" text-anchor="middle">Ctrl + Space</text>
  </g>

  <text x="440" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" font-size="72" fill="url(#text)">voxtype</text>

  <text x="442" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#94a3b8">Press Ctrl+Space. Speak. Done.</text>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#64748b">
    <text x="442" y="250">Free · Open source (MIT) · Linux</text>
    <text x="442" y="282">X11 + Wayland · Whisper-powered</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#34d399">
    <rect x="442" y="308" width="640" height="40" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.35)"/>
    <text x="462" y="333">curl -fsSL github.com/atheerium/voxtype/</text>
    <text x="462" y="352">  releases/latest/download/install.sh | bash</text>
  </g>

  <text x="442" y="390" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">by Atheerium · atheerium.com · ko-fi.com/atheerium</text>
</svg>
